; HopeBloom firmware: ESP32-C3-MINI-1 on the custom main board.
; "esp32-c3-devkitm-1" is only the build target: it uses the same chip and
; module, so the compiled code is identical for the custom board.

[env:hopebloom]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    madhephaestus/ESP32Servo@^3.0.5
    knolleary/PubSubClient@^2.8
